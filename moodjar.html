<html>
     <head>
          <title> Mood Bar </title>
          <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Shantell+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
          <style>
               html,body {
                    margin: 0;
                    height: 100%;
               }
               #scene {
                    position: absolute;
                    top: 0;
                    right: 0;
                    bottom: 0;
                    left: 0;
                    background: #fdf6ee;
                    display: flex;
                    justify-content: center;
                    align-items: center;

               }
               #popout {
                    width: 520px;
                    padding: 40px 30px;
                    background: #fff;
                    border: 3px solid #1a1a1a;
                    border-radius: 18px;
                    font-family: "Shantell Sans", cursive;
                    font-size: 26px;
                    color: #1a1a1a;
                    text-align: center;
               }
               #jars {
                    display: flex;
                    justify-content: center;
                    gap: 18px;
                    margin-top: 30px;
               }
               .jar {
                    width: 70px;
                    height: 90px;
                    border: 3px solid #1a1a1a;
                    border-radius: 8px 8px 14px 14px;
                    display: flex;
                    align-items: flex-end;
                    justify-content: center;
                    padding-bottom: 8px;
                    font-family: "Shantell Sans", cursive;
                    font-size: 14px;
                    background: #fdf6ee;
                    transition: transform 0.15s ease;
                    
               }
               .jar:hover {
                    transform: translateY(-6px);
                    cursor: pointer;
                    
               }
          </style>
     </head>
     <body>
          <div id = "scene"> 
             <div id = "popout"> What bars would you like to select? 
             <div id = "jars"> 
                <div class="jar" data-bar="sad">sad</div>
                <div class="jar" data-bar="happy">happy</div>
                <div class="jar" data-bar ="envy">envy</div>
                <div class="jar" data-bar="angry">angry</div>
                <div class="jar" data-bar="lonely">lonely</div>
                <div class="jar" data-bar="disghust">disghust</div>
             </div> 
          </div>
     </div>
     <script>
          const jars = document.qureyselector(".jar");
          jars.forEach(jar => {
               jar.addEventListener("click", () => {
                    console.log(jar.dataset.bar);
               });
          });


     </body>
</html>
