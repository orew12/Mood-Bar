<html>
     <head>
          <title> Mood Bar </title>
          <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Shantell+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
          <style>
               html,body {
                    margin: 0;
                    height: 100%;
               }
               #scene {
                    position: absolute;
                    top: 0;
                    right: 0;
                    bottom: 0;
                    left: 0;
                    background: #fdf6ee;

               }
               #popout {
                    width: 520px;
                    padding: 40px 30px;
                    background: #fff;
                    border: 3px solid #1a1a1a;
                    border-radius: 18px;
                    font-family: "Shantell Sans", cursive;
                    font-size: 26px;
                    color: #1a1a1a;
                    text-align: center;
               }
          </style>
     </head>
     <body>
          <div id = "popout"> What bars would you like to select? </div>

     </body>
</html>
